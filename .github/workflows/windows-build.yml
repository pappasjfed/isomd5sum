name: Windows Build and Release

on:
  push:  # Triggers on all branches
    tags:
      - 'v*'
  pull_request:  # Triggers on all branches
  workflow_dispatch:

# Set minimal default permissions
permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Executables
    runs-on: windows-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up CMake
        uses: lukka/get-cmake@latest
      
      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake -A x64 ..
      
      - name: Build
        run: |
          cd build
          cmake --build . --config Release
      
      - name: Install NSIS
        run: |
          # Install NSIS using Chocolatey (pre-installed on GitHub Actions Windows runners)
          choco install nsis -y
          
          # Refresh environment variables
          $env:PATH = [System.Environment]::GetEnvironmentVariable("PATH","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("PATH","User")
          
          # Verify NSIS installation
          $nsisPath = Get-Command makensis -ErrorAction SilentlyContinue
          if ($nsisPath) {
            Write-Host "NSIS installed successfully at: $($nsisPath.Source)"
          } else {
            Write-Host "Warning: NSIS may not be in PATH, but should be available"
          }
      
      - name: Build Installer
        run: |
          cd build
          cpack -C Release -G NSIS
          
          # Resolve installer deterministically and export both name and full path for later steps.
          $installer = Get-ChildItem -Path . -Filter "isomd5sum-*-win64.exe" -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $installer) {
            Write-Error "Installer not found in build directory (expected pattern: isomd5sum-*-win64.exe)."
            exit 1
          }

          $INSTALLER_NAME = $installer.Name
          $INSTALLER_PATH = $installer.FullName

          Write-Host "Installer file: $INSTALLER_NAME"
          Write-Host "Installer path: $INSTALLER_PATH"
          echo "INSTALLER_NAME=$INSTALLER_NAME" >> $env:GITHUB_ENV
          echo "INSTALLER_PATH=$INSTALLER_PATH" >> $env:GITHUB_ENV

      - name: Install Windows SDK signing tools
        shell: pwsh
        run: |
          $signtool = Get-Command signtool -ErrorAction SilentlyContinue
          if (-not $signtool) {
            Write-Host "signtool not found in PATH; installing Windows SDK Signing Tools..."
            Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2196241" -OutFile "$env:RUNNER_TEMP\winsdksetup.exe"
            Start-Process -FilePath "$env:RUNNER_TEMP\winsdksetup.exe" -ArgumentList "/features OptionId.SigningTools /quiet /norestart" -Wait
          }

          $signtoolPath = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\x64\\" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $signtoolPath) {
            $signtoolPath = Get-Command signtool -ErrorAction SilentlyContinue
          }

          if (-not $signtoolPath) {
            Write-Error "signtool.exe not found after Windows SDK signing tools installation."
            exit 1
          }

          $signtoolBin = if ($signtoolPath -is [System.Management.Automation.CommandInfo]) {
            Split-Path $signtoolPath.Source -Parent
          } else {
            Split-Path $signtoolPath.FullName -Parent
          }

          Write-Host "signtool path: $signtoolBin"
          $signtoolBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Decode certificate
        shell: pwsh
        run: |
          $b64 = "${{ secrets.CODE_SIGN_CERT_PAPPASJ }}".Trim()
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($b64))
          Write-Host "Certificate decoded successfully"

      - name: Validate installer path for signing
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ env.INSTALLER_PATH }}")) {
            Write-Error "INSTALLER_PATH is empty."
            exit 1
          }

          if (!(Test-Path "${{ env.INSTALLER_PATH }}" -PathType Leaf)) {
            Write-Error "Installer file not found: ${{ env.INSTALLER_PATH }}"
            exit 1
          }

          Write-Host "Installer path validated: ${{ env.INSTALLER_PATH }}"

      - name: Sign Installer file
        shell: pwsh
        run: |
          $pfxPassword = "${{ secrets.CODE_SIGN_CERT_PASS }}"
          if ([string]::IsNullOrWhiteSpace($pfxPassword)) {
            Write-Error "CODE_SIGN_CERT_PASS is empty or not configured."
            exit 1
          }

          $signtool = Get-Command signtool -ErrorAction SilentlyContinue
          if (-not $signtool) {
            Write-Error "signtool is not available in PATH."
            exit 1
          }

          Write-Host "Signing installer: ${{ env.INSTALLER_PATH }}"
          & $signtool.Source sign /fd SHA256 /f "cert.pfx" /p "$pfxPassword" /tr "http://timestamp.sectigo.com" /td SHA256 "${{ env.INSTALLER_PATH }}"

      - name: Delete certificate
        run: del -Force -verbose cert.pfx

      - name: Prepare artifacts
        run: |
          mkdir artifacts
          copy build\Release\checkisomd5.exe artifacts\
          copy build\Release\implantisomd5.exe artifacts\
          copy COPYING artifacts\LICENSE.txt
          copy README artifacts\README.txt
          copy docs\WINDOWS_BUILD.md artifacts\WINDOWS_BUILD.txt
          copy docs\WINDOWS_INSTALLER.md artifacts\WINDOWS_INSTALLER.txt
          
          # Copy installer if it exists
          $installer = Get-ChildItem -Path build -Filter "isomd5sum-*-win64.exe" | Select-Object -First 1
          if ($installer) {
            copy $installer.FullName artifacts\
            Write-Host "Installer copied: $($installer.Name)"
          } else {
            Write-Host "No installer found in build directory"
          }
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: isomd5sum-windows-x64
          path: artifacts/
          retention-days: 30
  
  test-windows:
    name: Test Windows Executables
    runs-on: windows-latest
    needs: build-windows
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          lfs: true
      
      - name: Checkout test assets from develop branch
        run: |
          git fetch origin develop
          git checkout origin/develop -- test/
          Write-Host "✓ Test assets retrieved"
      
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: isomd5sum-windows-x64
          path: ./bin
      
      - name: Test executables exist
        run: |
          if (!(Test-Path "bin\checkisomd5.exe")) { exit 1 }
          if (!(Test-Path "bin\implantisomd5.exe")) { exit 1 }
          Write-Host "✓ Executables found"
      
      - name: Test help output
        run: |
          cd bin
          # Note: --help returns exit code 1, which is fine
          $output = .\checkisomd5.exe --help 2>&1 | Out-String
          Write-Host "checkisomd5 --help output:"
          Write-Host $output
          Write-Host "Exit code: $LASTEXITCODE"
          Write-Host "✓ checkisomd5 can run"
          
          $output = .\implantisomd5.exe --help 2>&1 | Out-String
          Write-Host "implantisomd5 --help output:"
          Write-Host $output
          Write-Host "Exit code: $LASTEXITCODE"
          Write-Host "✓ implantisomd5 can run"
          
          # Reset exit code for next steps
          exit 0
      
      - name: Test with known good ISO (md5sumonly)
        run: |
          Write-Host "Testing checkisomd5 --md5sumonly with test.iso..."
          Write-Host "Expected MD5: a55e6ed72193ac49c96fa22599abe142"
          Write-Host ""
          
          $output = .\bin\checkisomd5.exe --md5sumonly .\test\test.iso 2>&1 | Out-String
          Write-Host "Output received:"
          Write-Host $output
          Write-Host "Exit code: $LASTEXITCODE"
          
          if ($output -match "a55e6ed72193ac49c96fa22599abe142") {
              Write-Host "✓ MD5 checksum displayed correctly"
          } else {
              Write-Host "✗ MD5 checksum NOT found in output"
              Write-Host "This indicates the output is not being captured or displayed"
              exit 1
          }
      
      - name: Test with known good ISO (full check with verbose)
        run: |
          Write-Host "Testing checkisomd5 --verbose with test.iso..."
          Write-Host ""
          
          # Use Start-Process to capture all output properly
          $output = & .\bin\checkisomd5.exe --verbose .\test\test.iso 2>&1 | Out-String
          Write-Host "Output received:"
          Write-Host $output
          Write-Host "Exit code: $LASTEXITCODE"
          
          if ($output -match "PASS|FAIL|complete") {
              Write-Host "✓ Media check result displayed"
          } else {
              Write-Host "✗ Media check result NOT found in output"
              Write-Host "This is the bug we need to fix!"
              exit 1
          }
      
      - name: Test full check (non-verbose)
        run: |
          Write-Host "Testing checkisomd5 (normal mode) with test.iso..."
          Write-Host ""
          
          $output = & .\bin\checkisomd5.exe .\test\test.iso 2>&1 | Out-String
          Write-Host "Output received:"
          Write-Host $output
          Write-Host "Exit code: $LASTEXITCODE"
          
          if ($output -match "PASS|FAIL|complete") {
              Write-Host "✓ Media check result displayed in normal mode"
          } else {
              Write-Host "✗ Media check result NOT found in output in normal mode"
              Write-Host "This confirms the Windows output bug"
              exit 1
          }
      
      - name: Summary
        if: always()
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Test Summary"
          Write-Host "=========================================="
          Write-Host "If tests failed, the Windows output bug is confirmed"
          Write-Host "The program runs but doesn't display final results"
  
  build-mingw:
    name: Build with MinGW (Cross-compile)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Install MinGW
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 cmake
      
      - name: Build with MinGW
        run: |
          mkdir build-mingw
          cd build-mingw
          cmake -DCMAKE_TOOLCHAIN_FILE=../cmake/mingw-w64.cmake ..
          make
      
      - name: Check executables
        run: |
          file build-mingw/checkisomd5.exe
          file build-mingw/implantisomd5.exe
      
      - name: Prepare MinGW artifacts
        run: |
          mkdir artifacts-mingw
          cp build-mingw/checkisomd5.exe artifacts-mingw/
          cp build-mingw/implantisomd5.exe artifacts-mingw/
          cp COPYING artifacts-mingw/LICENSE.txt
          cp README artifacts-mingw/README.txt
          cp docs/WINDOWS_BUILD.md artifacts-mingw/WINDOWS_BUILD.txt
      
      - name: Upload MinGW artifacts
        uses: actions/upload-artifact@v7
        with:
          name: isomd5sum-windows-x64-mingw
          path: artifacts-mingw/
          retention-days: 30
  
  create-prerelease:
    name: Create Pre-release (Develop Branch)
    runs-on: ubuntu-latest
    needs: [build-windows, test-windows, build-mingw]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    permissions:
      contents: write  # Needed to create releases
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Download MSVC artifacts
        uses: actions/download-artifact@v7
        with:
          name: isomd5sum-windows-x64
          path: ./release-msvc
      
      - name: Download MinGW artifacts
        uses: actions/download-artifact@v7
        with:
          name: isomd5sum-windows-x64-mingw
          path: ./release-mingw
      
      - name: Generate version info
        id: version
        run: |
          # Generate beta version with timestamp
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          VERSION="beta-${TIMESTAMP}-${SHORT_SHA}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Generated version: ${VERSION}"
      
      - name: Create release archives
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          # Create MSVC zip
          cd release-msvc
          # Copy installer separately if it exists
          if ls isomd5sum-*.exe 1> /dev/null 2>&1; then
            cp isomd5sum-*.exe ../isomd5sum-${VERSION}-win64.exe
            # Remove installer from zip to keep it separate
            rm -f isomd5sum-*.exe
          fi
          zip -r ../isomd5sum-${VERSION}-windows-x64-msvc.zip .
          cd ..
          
          # Create MinGW zip
          cd release-mingw
          zip -r ../isomd5sum-${VERSION}-windows-x64-mingw.zip .
          cd ..
          
          # Calculate checksums
          sha256sum isomd5sum-${VERSION}-windows-x64-msvc.zip > checksums.txt
          sha256sum isomd5sum-${VERSION}-windows-x64-mingw.zip >> checksums.txt
          if [ -f "isomd5sum-${VERSION}-win64.exe" ]; then
            sha256sum isomd5sum-${VERSION}-win64.exe >> checksums.txt
          fi
      
      - name: Create Pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "Pre-release ${{ steps.version.outputs.version }}"
          files: |
            isomd5sum-*.zip
            isomd5sum-*.exe
            checksums.txt
          body: |
            ## ⚠️ Pre-release / Beta Build
            
            This is an **automated pre-release** from the `develop` branch.
            
            **⚠️ Warning**: This is a development build and may be unstable. Use at your own risk!
            
            ### Build Information
            - **Branch**: develop
            - **Commit**: ${{ github.sha }}
            - **Build Date**: ${{ steps.version.outputs.version }}
            
            ### Downloads
            
            #### Windows Installer (Recommended)
            - **`isomd5sum-*-win64.exe`** - Windows installer (user or system install with PATH configuration)
            
            #### Portable Executables (Alternative)
            - **MSVC Build** (`isomd5sum-*-windows-x64-msvc.zip`): Built with Visual Studio 2022
            - **MinGW Build** (`isomd5sum-*-windows-x64-mingw.zip`): Built with MinGW-w64
            
            ### What's included
            - `checkisomd5.exe` - Check MD5 checksums embedded in ISO images
            - `implantisomd5.exe` - Implant MD5 checksums into ISO images
            - Documentation files
            
            ### Usage
            See `WINDOWS_BUILD.txt` included in the archive for detailed usage instructions.
            
            ### Checksums
            See `checksums.txt` for SHA256 checksums of the release files.
            
            ---
            
            For stable releases, see releases tagged with version numbers (e.g., v1.0.0).
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
