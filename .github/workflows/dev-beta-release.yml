name: Dev Branch Beta Release

on:
  pull_request:  # Triggers on all branches
  push:  # Triggers on all branches
  workflow_dispatch:

# Set minimal default permissions
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: registry.fedoraproject.org/fedora:39
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          dnf install -y gcc popt-devel python3 python3-devel make xorriso
      - name: Build
        run: |
          make
      - name: Run tests
        run: |
          make test
      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp checkisomd5 artifacts/
          cp implantisomd5 artifacts/
          cp COPYING artifacts/LICENSE.txt
          cp README artifacts/README.txt
      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: isomd5sum-linux-dev
          path: artifacts/
          retention-days: 30

  build-windows:
    name: Build Windows Executables
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up CMake
        uses: lukka/get-cmake@latest
      
      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake -A x64 ..
      
      - name: Build
        run: |
          cd build
          cmake --build . --config Release
      
      - name: Prepare artifacts
        run: |
          mkdir artifacts
          copy build\Release\checkisomd5.exe artifacts\
          copy build\Release\implantisomd5.exe artifacts\
          copy COPYING artifacts\LICENSE.txt
          copy README artifacts\README.txt
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: isomd5sum-windows-dev
          path: artifacts/
          retention-days: 30

  linux-packages:
    name: Build Linux Packages
    uses: ./.github/workflows/linux-packages.yml

  publish-beta-release:
    name: Publish Beta Release
    runs-on: ubuntu-latest
    needs: [build-and-test, build-windows, linux-packages]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    permissions:
      contents: write  # Needed to create releases
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download Linux artifacts
        uses: actions/download-artifact@v5
        with:
          name: isomd5sum-linux-dev
          path: ./release-linux
      
      - name: Download Windows artifacts
        uses: actions/download-artifact@v5
        with:
          name: isomd5sum-windows-dev
          path: ./release-windows

      - name: Download RPM artifacts
        uses: actions/download-artifact@v5
        with:
          name: isomd5sum-rpms
          path: ./release-rpms

      - name: Download DEB artifacts
        uses: actions/download-artifact@v5
        with:
          name: isomd5sum-debs
          path: ./release-debs
      
      - name: Generate version info
        id: version
        run: |
          # Generate beta version with timestamp
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          VERSION="beta-${TIMESTAMP}-${SHORT_SHA}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Generated version: ${VERSION}"
      
      - name: Create release archives
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          # Create Linux x64 archives (both tarball and zip)
          cd release-linux
          tar -czf ../isomd5sum-${VERSION}-linux-x64.tar.gz .
          zip -r ../isomd5sum-${VERSION}-linux-x64.zip .
          cd ..
          
          # Create Windows x64 zip
          cd release-windows
          zip -r ../isomd5sum-${VERSION}-windows-x64.zip .
          cd ..

          # Copy RPM packages
          cp release-rpms/*.rpm . 2>/dev/null || true

          # Copy DEB packages
          cp release-debs/*.deb . 2>/dev/null || true
          
          # Calculate checksums
          sha256sum isomd5sum-${VERSION}-linux-x64.tar.gz > checksums.txt
          sha256sum isomd5sum-${VERSION}-linux-x64.zip >> checksums.txt
          sha256sum isomd5sum-${VERSION}-windows-x64.zip >> checksums.txt
          for f in *.rpm *.deb; do
            [ -f "$f" ] && sha256sum "$f" >> checksums.txt || true
          done
      
      - name: Create Beta Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "Beta Release ${{ steps.version.outputs.version }}"
          files: |
            isomd5sum-*.tar.gz
            isomd5sum-*.zip
            *.rpm
            *.deb
            checksums.txt
          body: |
            ## ⚠️ Beta Release (Dev Branch)
            
            This is an **automated beta release** from the `dev` branch.
            
            **⚠️ Warning**: This is a development build and may be unstable. Use at your own risk!
            
            ### Build Information
            - **Branch**: dev
            - **Commit**: ${{ github.sha }}
            - **Build Date**: ${{ steps.version.outputs.version }}
            
            ### Downloads
            - **Linux x64 Build**: 
              - `isomd5sum-*-linux-x64.tar.gz` - Tarball format (Built on Fedora 39)
              - `isomd5sum-*-linux-x64.zip` - Zip format (Built on Fedora 39)
            - **Windows x64 Build**: 
              - `isomd5sum-*-windows-x64.zip` - Built with Visual Studio 2022
            - **RPM Packages** (Fedora/RHEL):
              - `isomd5sum-*.rpm` - Main binaries + man pages
              - `isomd5sum-devel-*.rpm` - Development headers and libraries
              - `isomd5sum-doc-*.rpm` - GNU info manual (optional)
              - `python3-isomd5sum-*.rpm` - Python 3 bindings
            - **DEB Packages** (Debian/Ubuntu):
              - `isomd5sum_*.deb` - Main binaries + man pages
              - `isomd5sum-dev_*.deb` - Development headers and libraries
              - `isomd5sum-doc_*.deb` - GNU info manual (optional)
            
            ### What's included
            - `checkisomd5` / `checkisomd5.exe` - Check MD5 checksums embedded in ISO images
            - `implantisomd5` / `implantisomd5.exe` - Implant MD5 checksums into ISO images
            - Documentation files
            
            ### Installing without documentation
            - **RPM**: Simply omit the `isomd5sum-doc` package, or use `dnf install --setopt=tsflags=nodocs`
            - **DEB**: Install only `isomd5sum` without `isomd5sum-doc` (docs are a separate `Suggests`)
            
            ### Checksums
            See `checksums.txt` for SHA256 checksums of the release files.
            
            ---
            
            For stable releases, see releases tagged with version numbers (e.g., v1.0.0).
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
