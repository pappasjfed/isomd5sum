name: Test

on:
  push:  # Triggers on all branches
  pull_request:  # Triggers on all branches

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Set minimal default permissions
permissions:
  contents: read

jobs:
  build-linux-makefile:
    name: Build on Linux with Makefile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: registry.fedoraproject.org/fedora:39
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          dnf install -y gcc popt-devel python3 python3-devel make xorriso
      - name: Build
        run: |
          make
      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp checkisomd5 artifacts/
          cp implantisomd5 artifacts/
          cp checkisosha artifacts/
          cp implantisosha artifacts/
          # sha256 aliases are symlinks; copy as files so they survive artifact packaging
          cp -L implantisosha256 artifacts/implantisosha256
          cp -L checkisosha256 artifacts/checkisosha256
          cp COPYING artifacts/LICENSE.txt
          cp README artifacts/README.txt
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: isomd5sum-linux-makefile
          path: artifacts/
          retention-days: 30
  
  test-linux-makefile-md5:
    name: Test MD5 on Linux (Makefile build)
    runs-on: ubuntu-latest
    needs: build-linux-makefile
    permissions:
      contents: read
    container:
      image: registry.fedoraproject.org/fedora:39
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          dnf install -y popt python3 python3-devel xorriso make gcc
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: isomd5sum-linux-makefile
          path: ./bin
      - name: Make executables runnable
        run: |
          chmod +x bin/checkisomd5 bin/implantisomd5 bin/checkisosha bin/implantisosha
      - name: Test executables exist
        run: |
          test -f bin/checkisomd5 || exit 1
          test -f bin/implantisomd5 || exit 1
          echo "✓ MD5 executables found"
      - name: Test MD5 help output
        run: |
          ./bin/checkisomd5 --help || true
          ./bin/implantisomd5 --help || true
          echo "✓ MD5 executables can run"
      - name: Run MD5 implant/read executable test
        run: |
          python3 test/create_synthetic_iso.py tiny md5_exec_test.iso
          ./bin/implantisomd5 md5_exec_test.iso
          md5_output="$(./bin/checkisomd5 --md5sumonly md5_exec_test.iso 2>&1)"
          echo "$md5_output"
          echo "$md5_output" | grep -Eq '[0-9a-fA-F]{32}'

  test-linux-makefile-sha:
    name: Test SHA-256 on Linux (Makefile build)
    runs-on: ubuntu-latest
    needs: build-linux-makefile
    permissions:
      contents: read
    container:
      image: registry.fedoraproject.org/fedora:39
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          dnf install -y popt python3 python3-devel xorriso make gcc
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: isomd5sum-linux-makefile
          path: ./bin
      - name: Make executables runnable
        run: |
          chmod +x bin/checkisomd5 bin/implantisomd5 bin/checkisosha bin/implantisosha
          chmod +x bin/implantisosha256 bin/checkisosha256 || true
      - name: Test SHA executables exist
        run: |
          test -f bin/checkisosha || exit 1
          test -f bin/implantisosha || exit 1
          echo "✓ SHA executables found"
      - name: Test SHA help output
        run: |
          ./bin/checkisosha --help || true
          ./bin/implantisosha --help || true
          echo "✓ SHA executables can run"
      - name: Run SHA implant/read executable test
        run: |
          python3 test/create_synthetic_iso.py tiny sha_exec_test.iso
          ./bin/implantisosha sha_exec_test.iso
          sha_output="$(./bin/checkisosha --checksumonly sha_exec_test.iso 2>&1)"
          echo "$sha_output"
          echo "$sha_output" | grep -Eq '[0-9a-fA-F]{64}'
  
  build-linux-cmake:
    name: Build on Linux with CMake
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libpopt-dev
      - name: Build
        run: |
          mkdir build
          cd build
          cmake ..
          make
      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp build/checkisomd5 artifacts/
          cp build/implantisomd5 artifacts/
          cp build/checkisosha artifacts/ || echo "checkisosha not found"
          cp build/implantisosha artifacts/ || echo "implantisosha not found"
          # sha256 aliases (created by CMake install code at build time via install rules;
          # for artifact collection we create symlinks from the build output)
          ln -sf implantisosha artifacts/implantisosha256 2>/dev/null || cp build/implantisosha artifacts/implantisosha256 || true
          ln -sf checkisosha artifacts/checkisosha256 2>/dev/null || cp build/checkisosha artifacts/checkisosha256 || true
          cp COPYING artifacts/LICENSE.txt
          cp README artifacts/README.txt
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: isomd5sum-linux-cmake
          path: artifacts/
          retention-days: 30
  
  test-linux-cmake:
    name: Test on Linux (CMake build)
    runs-on: ubuntu-latest
    needs: build-linux-cmake
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpopt0 xorriso
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: isomd5sum-linux-cmake
          path: ./bin
      - name: Make executables runnable
        run: |
          chmod +x bin/checkisomd5 bin/implantisomd5
          chmod +x bin/checkisosha bin/implantisosha || true
      - name: Test executables exist
        run: |
          test -f bin/checkisomd5 || exit 1
          test -f bin/implantisomd5 || exit 1
          echo "✓ Executables found"
      - name: Test help output
        run: |
          ./bin/checkisomd5 --help || true
          ./bin/implantisomd5 --help || true
          echo "✓ Executables can run"
      - name: Create test ISO
        run: |
          mkdir -p testdata
          echo "Hello from Linux CMake test" > testdata/test.txt
          xorriso -as mkisofs -o test.iso -V "TEST" -J -R testdata/
          echo "✓ Test ISO created"
      - name: Test MD5 ISO operations
        run: |
          # Test implanting MD5 checksum
          echo "Testing implantisomd5..."
          ./bin/implantisomd5 test.iso
          if [ $? -ne 0 ]; then
            echo "✗ Failed to implant MD5 checksum"
            exit 1
          fi
          echo "✓ MD5 checksum implanted successfully"
          
          # Test checking MD5 checksum
          echo "Testing checkisomd5..."
          ./bin/checkisomd5 --md5sumonly test.iso
          echo "✓ MD5 checksum verification executed"
      - name: Test SHA-256 ISO operations
        run: |
          # Create new ISO for SHA test
          xorriso -as mkisofs -o test-sha.iso -V "TEST-SHA" -J -R testdata/

          # Test implanting SHA-256 checksum
          echo "Testing implantisosha..."
          ./bin/implantisosha test-sha.iso || { echo "⚠ implantisosha not available in this build"; exit 0; }
          echo "✓ SHA-256 checksum implanted"

          # Test checking SHA-256 checksum (new --checksumonly flag)
          echo "Testing checkisosha --checksumonly..."
          ./bin/checkisosha --checksumonly test-sha.iso
          echo "✓ checkisosha --checksumonly executed"

          # Test sha256 aliases
          echo "Testing SHA-256 aliases..."
          # Create aliases in the test working dir
          ln -sf bin/implantisosha bin/implantisosha256 2>/dev/null || cp bin/implantisosha bin/implantisosha256
          ln -sf bin/checkisosha bin/checkisosha256 2>/dev/null || cp bin/checkisosha bin/checkisosha256
          chmod +x bin/implantisosha256 bin/checkisosha256

          xorriso -as mkisofs -o test-sha256-alias.iso -V "TEST-SHA256" -J -R testdata/
          ./bin/implantisosha256 test-sha256-alias.iso
          echo "✓ implantisosha256 alias works"
          ./bin/checkisosha256 --checksumonly test-sha256-alias.iso
          echo "✓ checkisosha256 alias works"

          echo ""
          echo "All CMake tests completed! ✓"

  build-windows-cmake:
    name: Build on Windows with CMake
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Set up CMake
        uses: lukka/get-cmake@latest
      - name: Build
        run: |
          mkdir build
          cd build
          cmake ..
          cmake --build . --config Release
      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          cp build/Release/checkisomd5.exe artifacts/ || echo "checkisomd5.exe not found"
          cp build/Release/implantisomd5.exe artifacts/ || echo "implantisomd5.exe not found"
          cp build/Release/checkisosha.exe artifacts/ || echo "checkisosha.exe not found"
          cp build/Release/implantisosha.exe artifacts/ || echo "implantisosha.exe not found"
          cp build/Release/checkisosha256.exe artifacts/ || echo "checkisosha256.exe not found"
          cp build/Release/implantisosha256.exe artifacts/ || echo "implantisosha256.exe not found"
          cp COPYING artifacts/LICENSE.txt
          cp README artifacts/README.txt
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: isomd5sum-windows-cmake
          path: artifacts/
          retention-days: 30

  test-windows-cmake-md5:
    name: Test MD5 on Windows (CMake build)
    runs-on: windows-latest
    needs: build-windows-cmake
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: isomd5sum-windows-cmake
          path: ./bin
      - name: Test MD5 executables exist
        shell: pwsh
        run: |
          if (-not (Test-Path "bin\checkisomd5.exe")) {
            Write-Host "✗ checkisomd5.exe not found"
            exit 1
          }
          if (-not (Test-Path "bin\implantisomd5.exe")) {
            Write-Host "✗ implantisomd5.exe not found"
            exit 1
          }
          Write-Host "✓ MD5 executables found"
      - name: Test MD5 help output
        shell: pwsh
        run: |
          & .\bin\checkisomd5.exe --help 2>&1 | Out-Null
          & .\bin\implantisomd5.exe --help 2>&1 | Out-Null
          Write-Host "✓ MD5 executables can run"
      - name: Create and test MD5 implant/read
        shell: pwsh
        run: |
          py -3 .\test\create_synthetic_iso.py tiny md5_exec_test.iso
          & .\bin\implantisomd5.exe .\md5_exec_test.iso
          if ($LASTEXITCODE -ne 0) {
            Write-Host "✗ implantisomd5.exe failed"
            exit 1
          }

          $output = & .\bin\checkisomd5.exe --md5sumonly .\md5_exec_test.iso 2>&1 | Out-String
          Write-Host $output
          if ($output -match '[0-9a-fA-F]{32}') {
            Write-Host "✓ MD5 executable implant/read works"
          } else {
            Write-Host "✗ MD5 checksum not found in output"
            exit 1
          }

  test-windows-cmake-sha:
    name: Test SHA-256 on Windows (CMake build)
    runs-on: windows-latest
    needs: build-windows-cmake
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: isomd5sum-windows-cmake
          path: ./bin
      - name: Test SHA executables exist
        shell: pwsh
        run: |
          $missing = $false
          foreach ($exe in @("checkisosha.exe","implantisosha.exe","checkisosha256.exe","implantisosha256.exe")) {
            if (Test-Path "bin\$exe") {
              Write-Host "✓ $exe found"
            } else {
              Write-Host "✗ $exe NOT found"
              $missing = $true
            }
          }
          if ($missing) { exit 1 }
      - name: Test SHA help output
        shell: pwsh
        run: |
          foreach ($exe in @("checkisosha.exe","implantisosha.exe","checkisosha256.exe","implantisosha256.exe")) {
            if (Test-Path "bin\$exe") {
              & ".\bin\$exe" --help 2>&1 | Out-Null
              Write-Host "✓ $exe can run"
            }
          }
          Write-Host "✓ SHA-256 Windows executables validated"
      - name: Create and test SHA implant/read
        shell: pwsh
        run: |
          py -3 .\test\create_synthetic_iso.py tiny sha_exec_test.iso
          & .\bin\implantisosha.exe .\sha_exec_test.iso
          if ($LASTEXITCODE -ne 0) {
            Write-Host "✗ implantisosha.exe failed"
            exit 1
          }

          $output = & .\bin\checkisosha.exe --checksumonly .\sha_exec_test.iso 2>&1 | Out-String
          Write-Host $output
          if ($output -match '[0-9a-fA-F]{64}') {
            Write-Host "✓ SHA executable implant/read works"
          } else {
            Write-Host "✗ SHA-256 checksum not found in output"
            exit 1
          }
